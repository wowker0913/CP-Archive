<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="覃柯蒙与龚晨美共同经历的时间线。">
  <link rel="icon" href="data:,">
  <title>Timeline · kiyo米·Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="timeline">
  <div data-site-header></div>
  <main class="page-shell">
    <header class="page-intro timeline-intro reveal">
      <h1>一起走过的时光</h1>
      <p class="section-code">TIMELINE</p>
      <p>按日期记录共同经历；如有遗漏请见谅</p>
    </header>
    <section class="timeline-toolbar" aria-label="时间线筛选">
      <select id="year-filter" aria-label="年份"><option value="all">全部年份</option></select>
      <div class="timeline-sort" role="group" aria-label="时间顺序">
        <button type="button" class="sort-button is-active" data-order="desc" aria-pressed="true">倒序</button>
        <button type="button" class="sort-button" data-order="asc" aria-pressed="false">正序</button>
      </div>
    </section>
    <section id="timeline-list" class="timeline-list" aria-live="polite"></section>
    <section id="timeline-posts" class="timeline-posts" aria-labelledby="timeline-posts-title" hidden>
      <div class="timeline-posts-heading">
        <p class="section-code">FAN POSTS</p>
        <h2 id="timeline-posts-title">延伸阅读</h2>
        <p>关于共同经历的豆瓣、微博安利帖；属于粉丝整理内容，与事件原始来源分开陈列。</p>
      </div>
      <ul id="timeline-posts-list" class="timeline-posts-list"></ul>
    </section>
  </main>
  <div data-site-footer></div>
  <script src="data/site-data.js"></script><script src="script.js"></script>
</body>
</html>
